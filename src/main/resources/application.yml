spring:
  application:
    name: lms
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

lms:
  jwt:
    # No fallback default here on purpose - a missing JWT_SECRET should fail
    # loudly at startup, not silently fall back to something checked into git.
    secret: ${JWT_SECRET}
    access-token-expiry-ms: 900000        # 15 minutes
    refresh-token-expiry-ms: 604800000    # 7 days
